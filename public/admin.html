<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>JM Fix · Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --b: #14171c;
        --s: #1b1f26;
        --s2: #22272f;
        --l: #333a45;
        --a: #ffb020;
        --t: #4dd6c4;
        --x: #f2f0ea;
        --m: #9aa2ad;
        --d: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--b);
        color: var(--x);
        font:
          15px system-ui,
          sans-serif;
      }
      header,
      main {
        max-width: 1120px;
        margin: auto;
        padding: 18px;
      }
      header {
        max-width: none;
        border-bottom: 1px solid var(--l);
        display: flex;
        justify-content: space-between;
        font-weight: 800;
      }
      main {
        padding-top: 32px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--l);
        border-radius: 7px;
        background: var(--s2);
        color: var(--x);
        font: inherit;
      }
      textarea {
        min-height: 75px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: var(--m);
        font-size: 12px;
      }
      .field {
        margin-bottom: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      button {
        padding: 9px 14px;
        border: 0;
        border-radius: 7px;
        background: var(--a);
        font-weight: 700;
        cursor: pointer;
      }
      .secondary {
        background: var(--s2);
        color: var(--x);
        border: 1px solid var(--l);
      }
      .danger {
        background: transparent;
        color: var(--d);
        border: 1px solid #6b3535;
      }
      .small {
        padding: 6px 9px;
        font-size: 12px;
      }
      .toolbar,
      .actions,
      .modal-actions,
      .add {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .toolbar {
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .search {
        max-width: 480px;
        margin-bottom: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--s);
      }
      th,
      td {
        padding: 11px;
        border-bottom: 1px solid var(--l);
        text-align: left;
        font-size: 13px;
      }
      th,
      .muted {
        color: var(--m);
      }
      .actions {
        white-space: nowrap;
      }
      .empty {
        padding: 30px;
        text-align: center;
        background: var(--s);
        color: var(--m);
      }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2;
        overflow: auto;
        padding: 25px 12px;
        background: #000a;
      }
      .overlay.show {
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .modal {
        width: 100%;
        max-width: 720px;
        padding: 22px;
        border-radius: 12px;
        background: var(--s);
        border: 1px solid var(--l);
      }
      .modal-actions {
        justify-content: flex-end;
        margin-top: 18px;
      }
      .checks {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .checks label {
        padding: 6px;
        border: 1px solid var(--l);
        border-radius: 5px;
        color: var(--x);
      }
      .checks input {
        width: auto;
      }
      .notice {
        font-size: 13px;
        color: var(--t);
        margin-top: 8px;
      }
      .error {
        color: var(--d);
      }
      #app {
        display: none;
      }
      #app[hidden],
      .panel-view[hidden] {
        display: none !important;
      }
      body:not(.authenticated) > .sidebar,
      body:not(.authenticated) > header,
      body:not(.authenticated) #app,
      body:not(.authenticated) .panel-view {
        display: none !important;
      }
      body.authenticated .overlay:not(.show) {
        display: none !important;
        pointer-events: none !important;
      }
      body.authenticated > .sidebar,
      body.authenticated > header,
      body.authenticated > main,
      body.authenticated .panel-view {
        pointer-events: auto;
      }
      @media (max-width: 650px) {
        .grid {
          grid-template-columns: 1fr;
        }
        th:nth-child(2),
        td:nth-child(2) {
          display: none;
        }
      }
    </style>
    <link rel="icon" type="image/jpeg" href="assets/Logo-Negro.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --b: #fff;
        --s: #f5f7f5;
        --s2: #fff;
        --l: #e2e5e2;
        --a: #4aa125;
        --t: #00bf63;
        --x: #14171a;
        --m: #6b7280;
        --d: #e5484d;
      }
      body {
        font-family: Inter, sans-serif;
        background: #fff;
        color: var(--x);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 3;
        background: #fff;
        border: 0;
        border-bottom: 1px solid var(--l);
        padding: 14px 28px;
        margin-left: 248px;
      }
      main {
        max-width: none;
        margin-left: 248px;
        padding: 32px 38px;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 248px;
        padding: 26px 16px;
        border-right: 1px solid var(--l);
        background: #fff;
        z-index: 5;
      }
      .brand-logo {
        display: block;
        width: 104px;
        height: 72px;
        object-fit: contain;
        margin: 0 10px 36px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        display: flex;
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--m);
        border: 0;
        padding: 12px;
        border-radius: 10px;
        box-shadow: none;
      }
      .nav button.active,
      .nav button:hover {
        background: #eff8ed;
        color: #267b16;
      }
      h1,
      h2 {
        font-family: Manrope, sans-serif;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin: 0 0 26px;
      }
      .metric {
        background: var(--s);
        border: 1px solid var(--l);
        padding: 20px;
        border-radius: 14px;
        border-left: 4px solid var(--t);
      }
      .metric strong {
        display: block;
        font:
          700 27px Manrope,
          sans-serif;
        margin-top: 8px;
      }
      .metric span {
        color: var(--m);
        font-size: 13px;
      }
      input,
      select,
      textarea {
        background: #fff;
        border-color: var(--l);
      }
      button {
        background: linear-gradient(135deg, #00bf63, #4aa125);
        color: #fff;
      }
      .secondary {
        background: #fff;
        color: var(--x);
        border-color: var(--l);
      }
      table {
        border: 1px solid var(--l);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      th {
        background: var(--s);
        color: var(--m);
      }
      .overlay {
        background: #14171a66;
      }
      .modal {
        background: #fff;
        border-color: var(--l);
      }
      #toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        padding: 13px 16px;
        border-radius: 10px;
        background: #14171a;
        color: #fff;
        opacity: 0;
        transition: 0.2s;
        z-index: 20;
      }
      #toast.show {
        opacity: 1;
      }
      @media (max-width: 760px) {
        .sidebar {
          transform: translateX(-100%);
          transition: 0.25s;
        }
        .sidebar.open {
          transform: none;
        }
        header,
        main {
          margin-left: 0;
        }
        main {
          padding: 22px 16px;
        }
        .summary {
          grid-template-columns: 1fr;
        }
        .menu-toggle {
          display: inline-block !important;
        }
        .close-nav {
          display: block !important;
        }
      }
      @media (min-width: 761px) {
        .menu-toggle,
        .close-nav {
          display: none !important;
        }
      }
    </style>
    <style>
      body:not(.authenticated) {
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 10%, #00bf6318, transparent 32rem),
          linear-gradient(135deg, #f7faf7, #ffffff 58%, #edf8ef);
      }
      body:not(.authenticated) main {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
      }
      #login { width: min(100%, 430px); }
      .login-card {
        padding: clamp(28px, 7vw, 44px);
        background: #fff;
        border: 1px solid #e2e5e2;
        border-radius: 22px;
        box-shadow: 0 22px 60px #14171a14;
      }
      .login-logo {
        display: block;
        width: 104px;
        height: 84px;
        margin: 0 auto 24px;
        object-fit: contain;
      }
      .login-card h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: 26px;
      }
      .login-card .muted {
        margin: 0 0 28px;
        text-align: center;
        line-height: 1.55;
      }
      .login-card label { font-weight: 600; color: #4b5563; }
      .login-card input { padding: 13px 14px; }
      .login-submit { width: 100%; margin-top: 8px; padding: 13px; }
      #loginError { min-height: 20px; text-align: center; }
      @media (max-width: 480px) {
        body:not(.authenticated) main { padding: 16px; }
        .login-card { padding: 28px 22px; border-radius: 18px; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <img class="brand-logo" src="assets/Logo-Negro.jpg" alt="JM Fix" /><button
        class="close-nav secondary small"
        id="closeNav"
      >
        Cerrar
      </button>
      <nav class="nav">
        <button class="active">▦ Dashboard</button><button>▤ Órdenes</button
        ><button>♙ Clientes</button><button>⌘ Equipos y accesorios</button
        ><button>⚙ Configuración</button>
      </nav>
    </aside>
    <header>
      <button class="menu-toggle secondary small" id="menuToggle">☰</button
      ><span>JM Fix · administración</span
      ><button id="logout" class="secondary small" hidden>Cerrar sesión</button>
    </header>
    <main>
      <section id="login">
        <div class="login-card">
          <img class="login-logo" src="assets/Logo-Negro.jpg" alt="JM Fix" />
          <h1>Ingresá al panel</h1>
          <p class="muted">
            Usá el correo y contraseña de tu cuenta de administración.
          </p>
          <form id="loginForm">
            <div class="field">
              <label>Correo</label><input id="email" type="email" required />
            </div>
            <div class="field">
              <label>Contraseña</label
              ><input id="password" type="password" required />
            </div>
            <button class="login-submit">Entrar al panel</button>
            <p id="loginError" class="notice error"></p>
          </form>
        </div>
      </section>
      <section id="app">
        <div class="toolbar">
          <div>
            <p class="muted">Resumen general</p>
            <h1 style="margin: 0">Dashboard</h1>
            <span id="count" class="muted"></span>
          </div>
          <button id="newOrder">+ Nueva orden</button>
        </div>
        <div class="summary">
          <div class="metric">
            <span>Órdenes activas</span><strong id="metricActive">—</strong>
          </div>
          <div class="metric">
            <span>Listas para retirar</span><strong id="metricReady">—</strong>
          </div>
          <div class="metric">
            <span>Saldo pendiente</span><strong id="metricBalance">—</strong>
          </div>
        </div>
        <h2 style="font-size: 18px">Órdenes recientes</h2>
        <input
          id="search"
          class="search"
          placeholder="Buscar por orden, cliente, DNI o tipo de equipo"
        />
        <div id="table"><div class="empty">Cargando órdenes…</div></div>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <div id="orderModal" class="overlay">
      <div class="modal">
        <h2 id="orderTitle">Nueva orden</h2>
        <form id="orderForm">
          <input id="editNumber" type="hidden" />
          <div class="field">
            <label>Cliente</label
            ><input
              id="clientSearch"
              placeholder="Buscar por nombre, apellido o DNI"
            />
            <div id="clientResults" class="notice"></div>
            <button id="createClient" type="button" class="secondary small">
              Crear cliente nuevo
            </button>
            <div id="selectedClient" class="notice"></div>
          </div>
          <div id="clientFields" hidden>
            <div class="grid">
              <div class="field">
                <label>Nombre *</label><input id="clientName" />
              </div>
              <div class="field">
                <label>Apellido *</label><input id="clientLast" />
              </div>
            </div>
            <div class="grid">
              <div class="field">
                <label>DNI *</label><input id="clientDni" />
              </div>
              <div class="field">
                <label>Teléfono</label><input id="clientPhone" />
              </div>
            </div>
            <div class="grid">
              <div class="field">
                <label>Gmail</label><input id="clientEmail" type="email" />
              </div>
              <div class="field">
                <label>Dirección</label><input id="clientAddress" />
              </div>
            </div>
          </div>
          <div class="grid">
            <div class="field">
              <label>Tipo de equipo *</label
              ><select id="equipment"></select>
              <div class="add">
                <input id="newEquipment" placeholder="Nuevo tipo" /><button
                  type="button"
                  class="secondary small"
                  data-add="equipmentTypes,newEquipment"
                >
                  Agregar
                </button>
              </div>
            </div>
            <div class="field">
              <label>Color *</label
              ><select id="color"></select>
              <div class="add">
                <input id="newColor" placeholder="Nuevo color" /><button
                  type="button"
                  class="secondary small"
                  data-add="colors,newColor"
                >
                  Agregar
                </button>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Descripción libre del equipo</label
            ><textarea id="description"></textarea>
          </div>
          <div class="field">
            <label>Accesorios</label>
            <div id="accessories" class="checks"></div>
            <div class="add">
              <input id="newAccessory" placeholder="Nuevo accesorio" /><button
                type="button"
                class="secondary small"
                data-add="accessoryOptions,newAccessory"
              >
                Agregar
              </button>
            </div>
          </div>
          <div class="field">
            <label>Estado</label
            ><select id="status">
              <option value="ingresado">Ingresado</option>
              <option value="diagnosticando">En diagnóstico</option>
              <option value="presupuestado">
                Presupuestado — esperando OK
              </option>
              <option value="en_reparacion">En reparación</option>
              <option value="esperando_repuesto">Esperando repuesto</option>
              <option value="listo">Listo para retirar</option>
              <option value="entregado">Entregado</option>
              <option value="no_reparable">No reparable</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="secondary close">Cancelar</button
            ><button>Guardar orden</button>
          </div>
          <p id="orderMsg" class="notice error"></p>
        </form>
      </div>
    </div>
    <div id="budgetModal" class="overlay">
      <div class="modal">
        <h2 id="budgetTitle">Presupuesto</h2>
        <form id="budgetForm">
          <div class="field">
            <label>Detalle del diagnóstico</label
            ><textarea id="diagnosis"></textarea>
          </div>
          <div class="grid">
            <div class="field">
              <label>Presupuesto ($)</label
              ><input id="quote" type="number" min="0" />
            </div>
            <div class="field">
              <label>Garantía</label><input id="warranty" />
            </div>
          </div>
          <div class="grid">
            <div class="field">
              <label>Total a cobrar ($)</label
              ><input id="total" type="number" min="0" />
            </div>
            <div class="field">
              <label>Pagado hasta ahora ($)</label
              ><input id="paid" type="number" min="0" />
            </div>
          </div>
          <p id="balance" class="notice"></p>
          <div class="modal-actions">
            <button type="button" class="secondary close">Cancelar</button
            ><button>Guardar presupuesto</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        getDocs,
        addDoc,
        setDoc,
        deleteDoc,
        query,
        orderBy,
        runTransaction,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
      const config = {
          apiKey: "AIzaSyDVNn84jMtB9INNXvD8QfJ8sIJqJXlruGQ",
          authDomain: "jmfix-pag.firebaseapp.com",
          projectId: "jmfix-pag",
          storageBucket: "jmfix-pag.firebasestorage.app",
          messagingSenderId: "589641823028",
          appId: "1:589641823028:web:9a692707d7f5da424bab61",
        },
        db = getFirestore(initializeApp(config)),
        auth = getAuth(),
        $ = (x) => document.getElementById(x),
        names = {
          ingresado: "Ingresado",
          diagnosticando: "En diagnóstico",
          presupuestado: "Presupuestado",
          en_reparacion: "En reparación",
          esperando_repuesto: "Esperando repuesto",
          listo: "Listo para retirar",
          entregado: "Entregado",
          no_reparable: "No reparable",
        };
      let orders = [],
        clients = [],
        opts = { equipmentTypes: [], colors: [], accessoryOptions: [] },
        client = null,
        budgetOrder = null;
      const money = (x) =>
          (Number(x) || 0).toLocaleString("es-AR", {
            style: "currency",
            currency: "ARS",
            maximumFractionDigits: 0,
          }),
        date = (x) =>
          x?.toDate ? x.toDate().toLocaleDateString("es-AR") : "—",
        safe = (x) =>
          String(x ?? "").replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const equipmentLabel = (o) => {
        const device = deviceDetails(o);
        return [
          device.type,
          device.model && "Modelo: " + device.model,
          device.color && "Color: " + device.color,
        ]
          .filter(Boolean)
          .join(" · ") || "—";
      };
      const deviceDetails = (o) => ({
        type:
          opts.equipmentTypes.find((x) => x.id === o.equipmentTypeId)
            ?.nombre || o.equipmentType || "",
        model:
          opts.equipmentModels?.find((x) => x.id === o.modelId)?.nombre ||
          o.modelo ||
          "",
        color: opts.colors.find((x) => x.id === o.color)?.nombre || o.colorNombre || "",
        accessories: (o.accesorios || [])
          .map((id) => opts.accessoryOptions.find((x) => x.id === id)?.nombre)
          .filter(Boolean)
          .join(", "),
      });
      let pdfLogo;
      async function getPdfLogo() {
        if (pdfLogo) return pdfLogo;
        const image = await fetch("assets/Logo-Negro.jpg");
        const blob = await image.blob();
        return (pdfLogo = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        }));
      }
      async function downloadOrderPdf(o) {
        const customer = clients.find((c) => c.id === o.clientId) || {};
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const saldo = (Number(o.total) || 0) - (Number(o.pagado) || 0);
        pdf.setFillColor(0, 191, 99);
        pdf.rect(0, 0, 210, 32, "F");
        pdf.setFillColor(74, 161, 37);
        pdf.triangle(95, 0, 210, 0, 210, 32, "F");
        try {
          pdf.addImage(await getPdfLogo(), "JPEG", 14, 5, 22, 22);
        } catch (e) {}
        pdf.setTextColor(255, 255, 255);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(20);
        pdf.text("JM FIX", 42, 17);
        pdf.setTextColor(245, 255, 247);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(10);
        pdf.text("Detalle de orden de reparación", 42, 24);
        pdf.setTextColor(20, 23, 28);
        let y = 44;
        const line = (label, value) => {
          pdf.setFont("helvetica", "bold");
          pdf.setFontSize(11);
          pdf.text(label, 15, y);
          pdf.setFont("helvetica", "normal");
          pdf.text(String(value != null && value !== "" ? value : "—"), 70, y);
          y += 9;
        };
        pdf.setFontSize(14);
        pdf.setFont("helvetica", "bold");
        pdf.text("Orden N.º " + o.numero, 15, y);
        y += 10;
        line("Fecha de ingreso:", date(o.fechaIngreso));
        line(
          "Cliente:",
          [customer.nombre, customer.apellido].filter(Boolean).join(" "),
        );
        line("DNI:", customer.dni);
        line("Estado:", names[o.estado] || o.estado);
        const device = deviceDetails(o);
        line("Tipo de equipo:", device.type);
        line("Modelo:", device.model);
        line("Color:", device.color);
        line("Accesorios:", device.accessories);
        y += 2;
        pdf.setFont("helvetica", "bold");
        pdf.text("Detalle del diagnóstico:", 15, y);
        y += 7;
        pdf.setFont("helvetica", "normal");

          '<div class="summary"><div class="metric"><span>Gastado en repuestos</span><strong>' +
          money(spent) +
          '</strong></div><div class="metric"><span>Ingresado</span><strong>' +
          money(income) +
          '</strong></div><div class="metric"><span>Balance</span><strong>' +
          money(income - spent) +
          '</strong></div></div><h2>Repuestos comprados</h2><div class="empty">' +
          (spares.length
            ? spares
                .map(
                  (r) =>
                    "Orden " +
                    r.numero +
                    " · " +
                    safe(r.descripcion) +
                    " · " +
                    money(r.valor),
                )
                .join("<br>")
            : "Sin repuestos este mes.") +
          '</div><h2>Órdenes con pago</h2><div class="empty">' +
          (paid.length
            ? paid
                .map((o) => "Orden " + o.numero + " · " + money(o.pagado))
                .join("<br>")
            : "Sin pagos este mes.") +
          "</div>";
      };
      $("cashMonth").value = new Date().toISOString().slice(0, 7);
      $("cashMonth").oninput = renderCash;
      document.querySelectorAll("[data-view]").forEach(
        (b) =>
          (b.onclick = () => {
            const view = b.dataset.view;
            document
              .querySelectorAll(".nav button")
              .forEach((x) => x.classList.toggle("active", x === b));
            [$("app"), clientView, equipmentView, cashView].forEach(
              (x) => (x.hidden = true),
            );
            if (view === "dashboard" || view === "orders") {
              $("app").hidden = false;
              if (view === "orders")
                $("app").querySelector("h1").textContent = "Órdenes";
            } else if (view === "clients") {
              clientView.hidden = false;
              renderClients();
            } else if (view === "cash") {
              cashView.hidden = false;
              renderCash();
            } else document.getElementById("view-" + view).hidden = false;
            $("sidebar").classList.remove("open");
          }),
      );
      const oldBudgetOpen = openBudget;
      openBudget = (o) => {
        budgetOrder = o;
        $("budgetTitle").textContent = "Presupuesto · orden N.º " + o.numero;
        $("diagnosis").value = o.detalleDiagnostico || "";
        $("warranty").value = o.garantia || "";
        $("total").value = o.total ?? "";
        $("paid").value = o.pagado ?? "";
        balance();
        $("budgetModal").classList.add("show");
      };
      $("budgetForm").onsubmit = async (e) => {
        e.preventDefault();
        const o = {
          ...budgetOrder,
          detalleDiagnostico: $("diagnosis").value.trim(),
          garantia: $("warranty").value.trim(),
          total: $("total").value === "" ? null : Number($("total").value),
          pagado: $("paid").value === "" ? 0 : Number($("paid").value),
        };
        delete o.presupuesto;
        await save(o);
        $("budgetModal").classList.remove("show");
        await getOrders();
      };
      const finalSave = async (o) => {
        delete o.presupuesto;
        delete o.descripcionEquipo;
        const device = deviceDetails(o);
        const p = {
          numero: o.numero,
          fechaIngreso: o.fechaIngreso,
          estado: o.estado,
          tipoEquipo: device.type || "",
          modeloEquipo: device.model || "",
          colorEquipo: device.color || "",
          accesorios: device.accessories || "",
          detalleDiagnostico: o.detalleDiagnostico || "",
          garantia: o.garantia || "",
          total: o.total ?? null,
          pagado: o.pagado ?? 0,
          saldo: (Number(o.total) || 0) - (Number(o.pagado) || 0),
        };
        await Promise.all([
          setDoc(doc(db, "orders", String(o.numero)), o),
          setDoc(doc(db, "publicOrders", String(o.numero)), p),
        ]);
        toast("Orden guardada correctamente");
      };
      save = finalSave;
      if (!$("description")) {
        const hidden = document.createElement("input");
        hidden.id = "description";
        hidden.type = "hidden";
        $("orderForm").append(hidden);
      }
      save = async (o) => {
        delete o.presupuesto;
        delete o.descripcionEquipo;
        o.modelId = $("model")?.value || o.modelId || "";
        o.repuestos = [...document.querySelectorAll(".spare")]
          .map((row) => {
            const x = row.querySelectorAll("input");
            return {
              descripcion: x[0].value.trim(),
              dondeComprado: x[1].value.trim(),
              valor: Number(x[2].value) || 0,
              garantiaRepuesto: x[3].value.trim(),
              fecha: x[4].value,
            };
          })
          .filter((x) => x.descripcion);
        const device = deviceDetails(o);
        const p = {
          numero: o.numero,
          fechaIngreso: o.fechaIngreso,
          estado: o.estado,
          tipoEquipo: device.type || "",
          modeloEquipo: device.model || "",
          colorEquipo: device.color || "",
          accesorios: device.accessories || "",
          detalleDiagnostico: o.detalleDiagnostico || "",
          garantia: o.garantia || "",
          total: o.total ?? null,
          pagado: o.pagado ?? 0,
          saldo: (Number(o.total) || 0) - (Number(o.pagado) || 0),
        };
        await Promise.all([
          setDoc(doc(db, "orders", String(o.numero)), o),
          setDoc(doc(db, "publicOrders", String(o.numero)), p),
        ]);
        toast("Orden guardada correctamente");
      };
      /* Keep spare parts strictly inside the private budget workflow. */
      const spareBlock = $("spares")?.parentElement;
      if (spareBlock) {
        $("budgetForm").querySelector(".modal-actions").before(spareBlock);
        spareBlock.querySelector("label").textContent =
          "Repuestos utilizados (solo interno)";
      }
      const originalBudgetForSpares = openBudget;
      openBudget = (o) => {
        originalBudgetForSpares(o);
        $("spares").innerHTML = "";
        (o.repuestos || []).forEach(addSpare);
      };
      /* Model creation is bound once, after its dynamic control exists. */
      if ($("addModel"))
        $("addModel").onclick = async () => {
          const nombre = $("newModel").value.trim();
          if (!nombre) return;
          try {
            const ref = await addDoc(collection(db, "equipmentModels"), {
              nombre,
            });
            opts.equipmentModels.push({ id: ref.id, nombre });
            $("model").innerHTML =
              '<option value="">Seleccionar…</option>' +
              opts.equipmentModels
                .sort((a, b) => a.nombre.localeCompare(b.nombre))
                .map(
                  (x) =>
                    '<option value="' +
                    x.id +
                    '">' +
                    safe(x.nombre) +
                    "</option>",
                )
                .join("");
            $("model").value = ref.id;
            $("newModel").value = "";
            toast("Modelo agregado");
          } catch (e) {
            toast("No se pudo agregar el modelo");
          }
        };
      /* Dedicated orders view with status filtering. */
      const ordersView = makeView(
        "orders",
        "Órdenes",
        '<div class="toolbar"><input id="ordersSearch" class="search" placeholder="Buscar orden, cliente, DNI o equipo"><select id="ordersStatus" style="max-width:260px"><option value="">Todos los estados</option><option value="ingresado">Ingresado</option><option value="diagnosticando">En diagnóstico</option><option value="presupuestado">Presupuestado</option><option value="en_reparacion">En reparación</option><option value="esperando_repuesto">Esperando repuesto</option><option value="listo">Listo para retirar</option><option value="entregado">Entregado</option><option value="no_reparable">No reparable</option></select></div><div id="ordersTable"></div>',
      );
      const renderOrdersOnly = () => {
        const term = $("ordersSearch").value.trim().toLowerCase(),
          status = $("ordersStatus").value,
          rows = orders.filter((o) => {
            const c = clients.find((x) => x.id === o.clientId) || {};
            return (
              (!status || o.estado === status) &&
              [o.numero, c.nombre, c.apellido, c.dni, equipmentLabel(o)]
                .join(" ")
                .toLowerCase()
                .includes(term)
            );
          });
        $("ordersTable").innerHTML = rows.length
          ? "<table><thead><tr><th>N.º</th><th>Ingreso</th><th>Cliente</th><th>Equipo</th><th>Estado</th><th>Saldo</th><th></th></tr></thead><tbody>" +
            rows
              .map((o) => {
                const c = clients.find((x) => x.id === o.clientId) || {};
                return (
                  "<tr><td>" +
                  o.numero +
                  "</td><td>" +
                  date(o.fechaIngreso) +
                  "</td><td>" +
                  safe((c.nombre || "") + " " + (c.apellido || "")) +
                  "</td><td>" +
                  safe(equipmentLabel(o)) +
                  "</td><td>" +
                  safe(names[o.estado] || o.estado) +
                  "</td><td>" +
                  money((o.total || 0) - (o.pagado || 0)) +
                  '</td><td class="actions"><button class="secondary small" data-order-edit="' +
                  o.numero +
                  '">Editar</button><button class="secondary small" data-order-budget="' +
                  o.numero +
                  '">Presupuesto</button><button class="secondary small" data-order-pdf="' +
                  o.numero +
                  '">PDF</button><button class="danger small" data-order-delete="' +
                  o.numero +
                  '">Borrar</button></td></tr>'
                );
              })
              .join("") +
            "</tbody></table>"
          : '<div class="empty">No hay órdenes para este filtro.</div>';
        document
          .querySelectorAll("[data-order-edit]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                openOrder(
                  orders.find((o) => String(o.numero) === b.dataset.orderEdit),
                )),
          );
        document
          .querySelectorAll("[data-order-budget]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                openBudget(
                  orders.find(
                    (o) => String(o.numero) === b.dataset.orderBudget,
                  ),
                )),
          );
        document
          .querySelectorAll("[data-order-delete]")
          .forEach((b) => (b.onclick = () => remove(b.dataset.orderDelete)));
        document
          .querySelectorAll("[data-order-pdf]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                downloadOrderPdf(
                  orders.find((o) => String(o.numero) === b.dataset.orderPdf),
                )),
          );
      };
      $("ordersSearch").oninput = renderOrdersOnly;
      $("ordersStatus").onchange = renderOrdersOnly;
      document.querySelectorAll("[data-view]").forEach(
        (b) =>
          (b.onclick = () => {
            const view = b.dataset.view;
            [$("app"), clientView, equipmentView, cashView, ordersView].forEach(
              (x) => (x.hidden = true),
            );
            document
              .querySelectorAll(".nav button")
              .forEach((x) => x.classList.toggle("active", x === b));
            if (view === "orders") {
              ordersView.hidden = false;
              renderOrdersOnly();
            } else if (view === "dashboard") {
              $("app").hidden = false;
              $("app").querySelector("h1").textContent = "Dashboard";
            } else if (view === "clients") {
              clientView.hidden = false;
              renderClients();
            } else if (view === "cash") {
              cashView.hidden = false;
              renderCash();
            } else {
              equipmentView.hidden = false;
            }
            $("sidebar").classList.remove("open");
          }),
      );
      /* Equipment catalogue: show and manage the collections in their own section. */
      equipmentView.innerHTML =
        '<div class="toolbar"><h1>Equipos y accesorios</h1></div><p class="muted">Las opciones que agregues se usan inmediatamente al crear o editar una orden.</p><div id="catalogue"></div>';
      const catalogueConfig = [
        ["equipmentTypes", "Tipos de equipo"],
        ["equipmentModels", "Modelos"],
        ["colors", "Colores"],
        ["accessoryOptions", "Accesorios"],
      ];
      const renderCatalogue = () => {
        $("catalogue").innerHTML = catalogueConfig
          .map(
            ([collectionName, title]) =>
              '<section class="metric" style="margin:14px 0"><h2 style="font-size:18px">' +
              title +
              '</h2><div class="add"><input id="catalogue-' +
              collectionName +
              '" placeholder="Agregar ' +
              title.toLowerCase().slice(0, -1) +
              '"><button class="small" data-catalogue-add="' +
              collectionName +
              '">Agregar</button></div><div class="checks">' +
              (opts[collectionName] || [])
                .map((x) => "<label>" + safe(x.nombre) + "</label>")
                .join("") +
              "</div></section>",
          )
          .join("");
        document.querySelectorAll("[data-catalogue-add]").forEach(
          (b) =>
            (b.onclick = async () => {
              const name = b.dataset.catalogueAdd,
                input = $("catalogue-" + name),
                nombre = input.value.trim();
              if (!nombre) return;
              const ref = await addDoc(collection(db, name), { nombre });
              opts[name] = [...(opts[name] || []), { id: ref.id, nombre }].sort(
                (a, c) => a.nombre.localeCompare(c.nombre),
              );
              input.value = "";
              renderCatalogue();
              renderOpts();
              if (name === "equipmentModels") {
                $("model").innerHTML =
                  '<option value="">Seleccionar…</option>' +
                  opts.equipmentModels
                    .map(
                      (x) =>
                        '<option value="' +
                        x.id +
                        '">' +
                        safe(x.nombre) +
                        "</option>",
                    )
                    .join("");
              }
              toast("Opción agregada");
            }),
        );
      };
      /* Dashboard: active orders only, followed by the monthly cash report. */
      const dashboardOrders = document.createElement("div");
      dashboardOrders.id = "dashboardActiveOrders";
      dashboardOrders.innerHTML =
        '<h2 style="font-size:18px">Órdenes activas</h2><div id="dashboardOrdersTable"></div><div id="dashboardCash"></div>';
      $("app").append(dashboardOrders);
      const renderDashboard = () => {
        const active = orders.filter(
          (o) => !["entregado", "no_reparable"].includes(o.estado),
        );
        $("dashboardOrdersTable").innerHTML = active.length
          ? "<table><thead><tr><th>N.º</th><th>Cliente</th><th>Equipo</th><th>Estado</th><th>Saldo</th></tr></thead><tbody>" +
            active
              .map((o) => {
                const c = clients.find((x) => x.id === o.clientId) || {};
                return (
                  "<tr><td>" +
                  o.numero +
                  "</td><td>" +
                  safe((c.nombre || "") + " " + (c.apellido || "")) +
                  "</td><td>" +
                  safe(equipmentLabel(o)) +
                  "</td><td>" +
                  safe(names[o.estado] || o.estado) +
                  "</td><td>" +
                  money((o.total || 0) - (o.pagado || 0)) +
                  "</td></tr>"
                );
              })
              .join("") +
            "</tbody></table>"
          : '<div class="empty">No hay órdenes activas.</div>';
        $("dashboardCash").innerHTML =
          '<h2 style="font-size:18px;margin-top:28px">Caja mensual</h2><div class="field"><label>Mes</label><input id="dashboardMonth" type="month"></div><div id="dashboardCashContent"></div>';
        $("dashboardMonth").value = new Date().toISOString().slice(0, 7);
        const paint = () => {
          const month = $("dashboardMonth").value,
            inMonth = (x) => String(x || "").startsWith(month),
            spares = orders.flatMap((o) =>
              (o.repuestos || [])
                .filter((r) => inMonth(r.fecha))
                .map((r) => ({ ...r, numero: o.numero })),
            ),
            paid = orders.filter((o) =>
              inMonth(o.fechaIngreso?.toDate?.().toISOString().slice(0, 7)),
            ),
            spent = spares.reduce((n, r) => n + (Number(r.valor) || 0), 0),
            income = paid.reduce((n, o) => n + (Number(o.pagado) || 0), 0);
          $("dashboardCashContent").innerHTML =
            '<div class="summary"><div class="metric"><span>Gastado en repuestos</span><strong>' +
            money(spent) +
            '</strong></div><div class="metric"><span>Ingresado</span><strong>' +
            money(income) +
            '</strong></div><div class="metric"><span>Balance</span><strong>' +
            money(income - spent) +
            '</strong></div></div><div class="empty">' +
            (spares.length
              ? spares
                  .map(
                    (r) =>
                      "Orden " +
                      r.numero +
                      " · " +
                      safe(r.descripcion) +
                      " · " +
                      money(r.valor),
                  )
                  .join("<br>")
              : "Sin repuestos este mes.") +
            "</div>";
        };
        $("dashboardMonth").oninput = paint;
        paint();
      };
      const previousGetOrders = getOrders;
      getOrders = async () => {
        await previousGetOrders();
        renderDashboard();
      };
      const previousOptionsForCatalogue = options;
      options = async () => {
        await previousOptionsForCatalogue();
        if (!$("view-equipment").hidden) renderCatalogue();
      };
      $("search").hidden = true;
      $("table").hidden = true;
      $("search").previousElementSibling.hidden = true;
      document.querySelector('[data-view="cash"]')?.remove();
      renderDashboard();
      document.querySelector('[data-view="equipment"]').onclick = () => {
        [$("app"), clientView, equipmentView, cashView, ordersView].forEach(
          (x) => (x.hidden = true),
        );
        equipmentView.hidden = false;
        renderCatalogue();
        document
          .querySelectorAll(".nav button")
          .forEach((x) =>
            x.classList.toggle("active", x.dataset.view === "equipment"),
          );
        $("sidebar").classList.remove("open");
      };
      const showPanel = (view) => {
        const panels = {
          dashboard: $("app"),
          orders: ordersView,
          clients: clientView,
          equipment: equipmentView,
        };
        document
          .querySelectorAll(".panel-view")
          .forEach((panel) => (panel.hidden = true));
        Object.entries(panels).forEach(([name, panel]) => {
          panel.hidden = name !== view;
        });
        document
          .querySelectorAll(".nav [data-view]")
          .forEach((button) =>
            button.classList.toggle("active", button.dataset.view === view),
          );
        if (view === "dashboard") {
          $("app").querySelector("h1").textContent = "Dashboard";
          renderDashboard();
        }
        if (view === "orders") renderOrdersOnly();
        if (view === "clients") renderClients();
        if (view === "equipment") renderCatalogue();
        $("sidebar").classList.remove("open");
      };
      document
        .querySelectorAll(".nav [data-view]")
        .forEach(
          (button) => (button.onclick = () => showPanel(button.dataset.view)),
        );
      showPanel("dashboard");
      const enhancedStyle = document.createElement("style");
      enhancedStyle.textContent = ".cash-income{color:#16803a!important}.cash-expense{color:#e5484d!important}.cash-balance-negative{color:#e5484d!important}.stage-ingresado{background:#eef1f3;color:#52606d}.stage-diagnosticando{background:#e6f5ff;color:#1677b8}.stage-presupuestado,.stage-esperando_repuesto{background:#fff4dd;color:#a86500}.stage-en_reparacion{background:#eaf7e7;color:#267b16}.stage-listo,.stage-entregado{background:#e2f7e9;color:#16803a}.stage-no_reparable{background:#ffe8e8;color:#e5484d}.stage{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:700;font-size:12px}.client-filter{margin:0 0 14px}.client-orders{margin-left:8px}.catalogue-details{margin:14px 0;border:1px solid #e2e5e2;border-radius:12px;padding:0 16px}.catalogue-details summary{padding:14px 0;font-weight:700;cursor:pointer}.catalogue-details .metric{border:0;margin:0!important;padding:0 0 16px!important}";
      document.head.append(enhancedStyle);
      const applyStages = (root = document) => {
        root.querySelectorAll("td").forEach((cell) => {
          const key = Object.entries(names).find(([, label]) => label === cell.textContent.trim())?.[0];
          if (key && !cell.querySelector(".stage"))
            cell.innerHTML =
              '<span class="stage stage-' + key + '">' +
              cell.textContent +
              "</span>";
        });
      };
      const enhancePanel = () => {
        applyStages($("dashboardOrdersTable"));
        document.querySelectorAll("#dashboardCashContent .metric").forEach((card, index) => {
          card.classList.toggle("cash-expense", index === 0);
          card.classList.toggle("cash-income", index === 1);
          card.classList.toggle("cash-balance-negative", index === 2 && card.textContent.includes("-"));
        });
        const list = $("clientsList");
        if (list && !list.querySelector(".client-filter")) {
          const filter = document.createElement("input");
          filter.className = "client-filter";
          filter.placeholder = "Filtrar por nombre, DNI, Gmail o teléfono";
          list.before(filter);
          filter.oninput = () => list.querySelectorAll("tbody tr").forEach(row => row.hidden = !row.textContent.toLowerCase().includes(filter.value.toLowerCase()));
        }
        list?.querySelectorAll("tbody tr").forEach((row, index) => {
          if (row.querySelector(".client-orders")) return;
          const customer = clients[index];
          const cell = document.createElement("td");
          const button = document.createElement("button");
          button.className = "secondary small client-orders";
          button.textContent = "Ver órdenes";
          button.onclick = () => {
            const assigned = orders.filter(order => order.clientId === customer?.id);
            alert("Órdenes de " + (customer?.nombre || "cliente") + ": " + assigned.map(order => "#" + order.numero + " — " + (names[order.estado] || order.estado)).join("\n"));
          };
          cell.append(button); row.append(cell);
        });
        document.querySelectorAll("#catalogue > section").forEach(section => {
          if (section.parentElement.tagName !== "DETAILS") {
            const details = document.createElement("details"); details.className = "catalogue-details";
            const summary = document.createElement("summary"); summary.textContent = section.querySelector("h2")?.textContent || "Opciones";
            section.before(details); details.append(summary, section);
          }
        });
      };
      enhancePanel();
    </script>
  </body>
</html>
